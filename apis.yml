name: Onit
description: >-
  Onit is a Kenyan digital bank operated by Onit Microfinance Bank Inc. and regulated
  by the Central Bank of Kenya (CBK), with deposits protected by the Kenya Deposit
  Insurance Corporation (KDIC). Formerly known as Shara, Onit provides a free
  peer-to-peer transaction network linking consumers, businesses, and suppliers:
  users can send and receive money instantly and at no cost between Onit accounts,
  run separate personal and business accounts, and access loans and checkout/BNPL
  finance from a single mobile app. The company positions open APIs as part of its
  offering to let partners and merchants integrate consumer payments, though it does
  not currently publish a public developer portal or API documentation. Onit is a
  portfolio company of Speedinvest and operates in the emerging-markets fintech space.
